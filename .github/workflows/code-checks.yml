name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  js_checks:
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: npx eslint .

      - name: Build npm package
        run: pnpm run npm_package:build

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run npm_package:test

      - name: Upload JS coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: ./npm_package/coverage/lcov.info
          flags: javascript
          name: javascript-coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  dotnet_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run analyzers
        run: dotnet build --no-restore --configuration Release /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true

      - name: Run tests with coverage
        run: dotnet test src/CKEditor.Blazor.Tests/CKEditor.Blazor.Tests.csproj --results-directory ./TestResults /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura

      - name: Show coverage summary
        if: always()
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"coveragereport" -reporttypes:TextSummary
          cat coveragereport/Summary.txt

      - name: Upload .NET coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          flags: dotnet
          name: dotnet-coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install JS dependencies
        run: pnpm install

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Install Playwright Browsers
        run: pnpm run dotnet:e2e:install

      - name: Start dev server in background and wait
        env:
          DOTNET_WATCH_SUPPRESS_BROWSER_LAUNCH: 1
          BROWSER: none
        run: |
          pnpm run dev &
          npx wait-on tcp:5175 --delay 300 --timeout 200000

      - name: Run E2E tests
        run: pnpm run dotnet:e2e
