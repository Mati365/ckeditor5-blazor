name: Code checks

on:
  push:
  pull_request:

jobs:
  js_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: npx eslint .

      - name: Build npm package
        run: pnpm run npm_package:build

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run npm_package:test

  dotnet_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run analyzers
        run: dotnet build --no-restore --configuration Release /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true

      - name: Run tests with coverage
        run: dotnet test --results-directory ./TestResults /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura

      - name: Show coverage summary
        if: always()
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"coveragereport" -reporttypes:TextSummary
          cat coveragereport/Summary.txt
